server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # เป็น SPA ทุก path ที่ไม่ตรงกับไฟล์จริงต้องคืน index.html
    # ไม่งั้นกด refresh ที่ /rooms/5 แล้วจะได้ 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ชื่อ backend ตรงกับชื่อ service ทั้งใน docker-compose และใน k8s
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ไฟล์ที่มี hash ในชื่ออยู่แล้ว cache ยาวได้
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
