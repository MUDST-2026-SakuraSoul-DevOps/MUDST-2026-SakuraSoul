spring:
  application:
    name: apartment

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sakura}
    username: ${SPRING_DATASOURCE_USERNAME:sakura}
    # ไม่มีค่า default ให้รหัสผ่าน ตั้งใจให้ต่อ database ไม่ติดไปเลยถ้าลืมส่งเข้ามา
    # ดีกว่าปล่อยให้ขึ้นได้ด้วยรหัสที่ทุกคนที่ clone repo ไปรู้
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      data-source-properties:
        # ไม่ให้ข้อความ error ของ PostgreSQL มีบรรทัด Detail ที่ใส่ค่าจริงในแถวลงไป (เช่น "Key (national_id)=(1234567890123) already exists"
        # หรือ "Failing row contains (3, ชื่อผู้เช่า, ...)") ข้อความ error ถูกบันทึกลง span ของ SQL ใน Tempo (ค้าง 72 ชั่วโมง) และลง log
        # ชื่อ constraint ยังอยู่ครบ ApiExceptionHandler จึงยังแปลงเป็น 409 ข้อความเดิมได้ (SSK-186 ตามรีวิวโค้ด)
        logServerErrorDetail: false

  jpa:
    # schema เป็นหน้าที่ของ Flyway อย่างเดียว validate ไว้เพื่อให้ startup พังทันที
    # ถ้า entity กับ migration เริ่มไม่ตรงกัน ดีกว่าไปเจอตอน runtime
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Bangkok

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  # อัปโหลดไฟล์ CSV ค่าน้ำค่าไฟ (SSK-166) สัญญา API จำกัดไฟล์ไว้ 1 MB ซึ่ง MeterCsv ตรวจเองแล้วตอบ 400 ข้อความที่ตกลงไว้
  # เพดานของ Spring ตั้งสูงกว่านั้นเผื่อไว้ ไฟล์ 1-2 MB จะได้ข้อความนั้น ไม่ใช่ error ของ framework
  # (ค่าตั้งต้นของ Spring คือ 1MB = 1,048,576 ไบต์ ซึ่งใกล้ 1,000,000 จนข้อความจะสลับไปมาตามขนาดไฟล์)
  # เกิน 2 MB ได้ 413 จาก ApiExceptionHandler ส่วน nginx (frontend/nginx.conf) รับถึง 3m ให้คำขอมาถึงที่นี่ก่อน
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # อีเมลใบเสร็จ (SSK-143) ส่งเข้า Mailpit ที่รันเป็น service หนึ่งใน docker compose และ k8s
  # Mailpit ไม่ได้ตั้ง relay ไว้ อีเมลทุกฉบับจึงค้างอยู่ในกล่องของมัน ไม่ออกนอกเครื่อง (วิชาห้ามใช้บริการภายนอก)
  # ค่าตั้งต้น localhost:1025 คือ Mailpit ที่ compose เปิด port ไว้ให้ ./gradlew bootRun นอก compose ใช้
  # ไม่มี username/password เพราะ Mailpit ในเครื่องเราไม่ต้องล็อกอิน
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    # ค่าตั้งต้นของ JavaMail คือรอไม่มีกำหนด ถ้า Mailpit ค้าง คำขอส่งอีเมลจะค้างตามไปด้วย
    # ห้าวินาทีพอสำหรับ SMTP ในเครื่องเดียวกัน เกินนั้นแปลว่าติดต่อไม่ได้ ผู้ใช้จะได้ 503 แทน
    # ต้องครอบชื่อด้วย [ ] ไม่งั้น Spring จะตัดจุดในชื่อทิ้งตอน bind เข้า map แล้ว JavaMail จะไม่เห็นค่า
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  port: 8080

  servlet:
    session:
      # 8 ชั่วโมงคือหนึ่งกะทำงานของคนดูแลหอ เปิดเช้ามาล็อกอินครั้งเดียวแล้วใช้ได้ทั้งวัน
      # ไม่ต้องมาล็อกอินใหม่กลางคัน ค่าตั้งต้นของ Spring Boot คือ 30m ซึ่งสั้นไปสำหรับงานนี้
      #
      # US-01-S3 เขียนไว้ว่าเวลาหมดอายุต้องตกลงกับทีมอีกครั้ง 8h เป็นค่าที่ใช้ไปก่อน
      # ถ้าทีมเคาะเป็นค่าอื่นให้แก้ที่บรรทัดนี้บรรทัดเดียว แล้วแก้ docs/api-contract-lease.md
      # หัวข้อ "การเข้าสู่ระบบ" ให้ตรงกันด้วย
      timeout: 8h
      cookie:
        # JavaScript อ่าน cookie ตัวนี้ไม่ได้ ถ้ามี XSS หลุดเข้ามาสักจุดจะขโมย session ไปไม่ได้
        # หน้าเว็บไม่ต้องอ่าน cookie เองอยู่แล้ว เบราว์เซอร์แนบให้เองทุกคำขอ
        http-only: true
        # lax ทำให้เบราว์เซอร์ไม่แนบ cookie ไปกับคำขอที่เว็บอื่นเป็นคนสั่ง (เช่น form POST
        # ข้ามเว็บ) ซึ่งเป็นเหตุผลที่ปิด csrf ได้ใน SecurityConfig ทั้งสองเรื่องนี้ผูกกัน
        # ถ้าจะเปลี่ยนค่านี้เป็น none ต้องกลับไปเปิด csrf พร้อมกัน
        same-site: lax
        # secure ไม่ได้ตั้งไว้โดยตั้งใจ เพราะ dev กับ minikube รันบน http ถ้าบังคับ secure
        # เบราว์เซอร์จะไม่ส่ง cookie กลับมาเลยและล็อกอินไม่ติดโดยไม่มี error ให้เห็น
        # วันที่ขึ้น https จริงให้ตั้ง SERVER_SERVLET_SESSION_COOKIE_SECURE=true ที่ environment

# แอดมินคนแรกที่ AdminUserInitializer จะสร้างให้ตอนสตาร์ต ถ้าตาราง admin_user ยังว่าง
# รหัสผ่านว่างเป็นค่าตั้งต้นโดยตั้งใจ ไม่ตั้งค่าก็ไม่มีใครถูกสร้าง และจะมี WARN ใน log บอกวิธีตั้ง
# ห้ามใส่รหัสผ่านจริงลงไฟล์นี้ ให้ส่งผ่าน environment variable เท่านั้น
app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Administrator}
  # ที่อยู่ผู้ส่งของอีเมลใบเสร็จ ไม่ใช่ความลับ ชื่อที่ผู้เช่าเห็นคือ Sakura Soul Apartment เสมอ
  mail:
    from: ${APP_MAIL_FROM:billing@sakura-soul.local}
  metrics:
    # รหัสของผู้ใช้ metrics ที่ใช้ดึง /actuator/prometheus ไม่มีค่าตั้งต้นโดยตั้งใจ
    # ไม่ตั้ง = endpoint เข้าไม่ได้เลย (ปลอดภัยไว้ก่อน) ส่งผ่านตัวแปร APP_METRICS_PASSWORD
    password: ${APP_METRICS_PASSWORD:}

logging:
  level:
    # ตัวส่ง span ของ OpenTelemetry เขียน ERROR พร้อม stack trace ทุกครั้งที่ส่งเข้า Tempo ไม่ได้ (เช่น Tempo ล่มหรือรีสตาร์ต)
    # แอปทำงานปกติ แค่ทิ้ง span แต่ log ระดับ ERROR จะไปนับในกราฟ ERROR ของ dashboard System Health ทำให้ดูเหมือนระบบพัง
    # จึงปิด log ของ HttpExporter (อยู่ใต้ io.opentelemetry.exporter) ตัวเดียว
    # ข้อแลกเปลี่ยน: ถ้าตั้ง OTEL_TRACES_ENDPOINT ผิด (ได้ 404/415) ก็จะเงียบเหมือนกัน ต้องดูว่า trace ไม่ขึ้นใน Tempo แทน
    # ด่านตรวจ Tempo ใน deploy.yml ตรวจว่า trace ถึง Tempo จริง
    # ไม่ปิด io.opentelemetry.sdk.trace.export เพราะตัวนั้นเขียนแค่ WARNING ตอน span ถูกทิ้งเพราะคิวเต็ม ซึ่งเป็นคำเตือนที่ต้องเห็น
    io.opentelemetry.exporter: "OFF"

management:
  endpoints:
    web:
      exposure:
        # prometheus เปิดไว้ให้ Prometheus ดึง metric (SSK-182) แต่ต้องใช้ HTTP Basic ของผู้ใช้ metrics เสมอ
        # (MetricsSecurityConfig) และ nginx ของ frontend ไม่ส่ง path นี้ออกสู่ผู้ใช้ ดู frontend/nginx.conf
        include: health,info,prometheus
  observations:
    enable:
      # span ของ filter ใน Spring Security มี 20 กว่าตัวต่อคำขอ ทำให้ trace อ่านยากโดยไม่ได้ข้อมูลที่ใช้ตัดสินใจ
      spring:
        security: false
  tracing:
    sampling:
      # 1.0 = เก็บทุกคำขอ เหมาะกับหอพักที่ทราฟฟิกน้อยและตอนเดโม ถ้าทราฟฟิกสูงให้ลดผ่าน TRACING_SAMPLING_PROBABILITY
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # ที่ตั้ง Tempo (OTLP/HTTP) บน compose กับ k8s ตั้งผ่าน environment ค่านี้ใช้ตอนรันบนเครื่องตัวเองโดยไม่มี Tempo
          # export ล้มเหลวจะไม่ทำให้คำขอล้ม แค่ทิ้ง span
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # metric ใช้ Prometheus ดึงเอง (pull) ไม่ต้องให้ OTLP ส่ง (push) ซ้ำอีกทาง
        enabled: false
  metrics:
    distribution:
      # ส่ง histogram bucket ของเวลาตอบ HTTP ให้ Prometheus คำนวณ p50/p95/p99 ใน dashboard ได้ (SSK-183)
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # ปิดตัวที่ Spring Boot แถมมากับ starter-mail ตั้งใจไว้ ตัวนั้นจะต่อ SMTP ทุกครั้งที่มีคนเรียก /actuator/health
    # แล้วรายงาน DOWN ทั้งแอปเมื่อ Mailpit ไม่อยู่ ทั้งที่แอปยังใช้งานได้ครบทุกอย่างยกเว้นการส่งอีเมล
    # อาการของ Mailpit ล่มจึงต้องเป็น 503 ตอนกดส่ง ไม่ใช่ health แดงทั้งแอปตอนเดโม
    mail:
      enabled: false
