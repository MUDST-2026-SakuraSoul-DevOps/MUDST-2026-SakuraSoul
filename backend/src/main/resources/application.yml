spring:
  application:
    name: apartment

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sakura}
    username: ${SPRING_DATASOURCE_USERNAME:sakura}
    password: ${SPRING_DATASOURCE_PASSWORD:sakura}

  jpa:
    # schema เป็นหน้าที่ของ Flyway อย่างเดียว validate ไว้เพื่อให้ startup พังทันที
    # ถ้า entity กับ migration เริ่มไม่ตรงกัน ดีกว่าไปเจอตอน runtime
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Bangkok

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
