apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sakura-soul
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sakura-soul-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sakura-soul
spec:
  # NodePort เพื่อให้เรียก minikube service frontend -n sakura-soul ได้
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
