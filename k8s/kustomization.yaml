apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ใช้ได้ทั้ง kubectl apply -k k8s/ และ kubectl apply -f k8s/
# ชื่อไฟล์ขึ้นต้นด้วยตัวเลขเพื่อให้แบบ -f apply เรียงลำดับถูก namespace ต้องมาก่อนเสมอ
resources:
  - 00-namespace.yaml
  - 10-postgres.yaml
  - 20-backend.yaml
  - 30-frontend.yaml

# includeSelectors: false ตั้งใจ ไม่ให้ label ตัวนี้ไปเติมใน matchLabels ของ Deployment
# เพราะ selector ของ Deployment แก้ไม่ได้หลังสร้างแล้ว ถ้าเผลอใส่จะ apply ทับไม่ได้ต้องลบทิ้งอย่างเดียว
labels:
  - pairs:
      app.kubernetes.io/part-of: sakura-soul
    includeSelectors: false
