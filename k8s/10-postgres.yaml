# รหัสผ่านในนี้เป็นของ environment ทดลองบน minikube เท่านั้น
# ถ้าจะขึ้นที่อื่นจริงให้ย้ายไป sealed-secrets หรือ external secret store อย่าคอมมิตของจริงลง repo
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: sakura-soul
type: Opaque
stringData:
  POSTGRES_DB: sakura
  POSTGRES_USER: sakura
  POSTGRES_PASSWORD: sakura
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: sakura-soul
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sakura-soul
spec:
  replicas: 1
  # ข้อมูลอยู่บน PVC ตัวเดียว ถ้าใช้ RollingUpdate จะมีสอง pod แย่ง volume กัน
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sakura", "-d", "sakura"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sakura", "-d", "sakura"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sakura-soul
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
