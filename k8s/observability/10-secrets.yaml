# รหัสเข้า Grafana (SSK-182) ไม่มีรหัสจริงในไฟล์นี้ ค่าที่เห็นเป็นแค่ที่วางไว้
# ต้องเปลี่ยนก่อน apply ทุกครั้ง deploy.yml สุ่มให้เองใน CI แบบเดียวกับ admin-credentials
