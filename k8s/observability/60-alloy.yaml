# Alloy เก็บ log ของ pod ใน namespace นี้ส่งเข้า Loki (SSK-182) อ่านผ่าน Kubernetes API จึงไม่ต้อง mount path ของ node
# สิทธิ์ที่ให้: อ่าน pod และ log ใน namespace sakura-soul เท่านั้น (Role ไม่ใช่ ClusterRole)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.9.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 224Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
