apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sakura-soul
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sakura-soul-backend:local
          # image ถูก build ไว้ใน docker daemon ของ minikube เอง
          # ถ้าไม่ตั้งบรรทัดนี้ k8s จะไปหาบน registry ข้างนอกแล้วขึ้น ImagePullBackOff
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/sakura
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # startupProbe รอให้ Flyway migrate เสร็จก่อน จะได้ไม่โดน liveness ฆ่าทิ้งระหว่างสตาร์ต
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sakura-soul
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
