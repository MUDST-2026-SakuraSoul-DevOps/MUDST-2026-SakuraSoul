# Tempo แบบ single binary รับ trace ผ่าน OTLP (SSK-182 ตั้งโครง SSK-186 ส่ง trace เข้ามา)
# backend ส่งมาที่ tempo:4317 (gRPC) หรือ tempo:4318 (HTTP)
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 72h

usage_report:
  reporting_enabled: false
